# Configuration file for running the mnist_fc benchmark (big model).
general:
  device: cpu
  conv_mode: matrix
  complete_verifier: bab-refine
  normal_run: false
model:
  onnx_path: ../alpha_beta_CROWN/complete_verifier/models/vnncomp24/mnist/MNISTmodel_asVT7.onnx
  input_shape: [-1, 1, 28, 28]  # This onnx model has input shape [-1, 784] which is not compatible with our MIP solution
specification:
  type: lp
  norm: .inf
solver:
  batch_size: 200
  beta-crown:
    iteration: 20
    lr_beta: 0.03
  mip:
    parallel_solvers: 2
    solver_threads: 2
    refine_neuron_time_percentage: 0.8
attack:
  pgd_order: after
  pgd_steps: 50
  pgd_restarts: 50
  pgd_batch_size: 100
bab:
  get_upper_bound: true  # Needed for Bab-Attack.
  branching:
    candidates: 5
    reduceop: max
  timeout: 900
  cut:
    enabled: true
    biccos:
      enabled: true
      multi_tree_branching:
        enabled: true
        k_splits: 5
        iterations: 5
