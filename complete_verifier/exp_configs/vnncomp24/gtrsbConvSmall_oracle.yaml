general:
  loss_reduction_func: min
  device: cpu
  normal_run: false
model:
  onnx_path: ../alpha_beta_CROWN/complete_verifier/models/vnncomp24/gtsrb/GTSRB_convSmall.onnx
  input_shape: [-1, 1, 32, 32]
specification:
  type: lp
  norm: .inf
data:
  num_outputs: 10
attack:
  pgd_restarts: 50
  pgd_batch_size: 50
solver:
  batch_size: 128
  alpha-crown:
    disable_optimization: ['MaxPool']
  beta-crown:
    iteration: 20
    lr_beta: 0.03
  mip:
    parallel_solvers: 4
    solver_threads: 2
    refine_neuron_time_percentage: 1.0
    skip_unsafe: True
bab:
  branching:
    candidates: 5
    reduceop: max
    nonlinear_split:
      disable: true
  timeout: 1000