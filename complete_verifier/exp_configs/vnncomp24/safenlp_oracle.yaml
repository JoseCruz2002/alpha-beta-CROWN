# Configuration file for running the safeNLP benchmark (all properties).
general:
  complete_verifier: mip
  device: cpu
  enable_incomplete_verification: true
  normal_run: false
model:
  onnx_path: ../alpha_beta_CROWN/complete_verifier/models/vnncomp24/safenlp/medical/perturbations_0.onnx
specification:
  type: lp
  norm: .inf
solver:
  mip:
    parallel_solvers: 4
    solver_threads: 2
attack:
  pgd_order: skip
  pgd_restarts: 10000
