# Example for using customized model and data loader.
# Model and data loader defined in custom_model_data.py
# python abcrown.py --config exp_configs/tutorial_examples/custom_cifar_data_example.yaml
general:
  device: cpu 
  save_output: false
  normal_run: false
  complete_verifier: mip # change to mip?
  enable_incomplete_verification: true # Needed to be true for mip or bab-refine complete_verifiers
  show_adv_example: true
model:
  # Model is defined as simple_conv_model() in custom_model_data.py. The function simple_conv_model() will be called with arguments in_channel=3, out_dim=10.
  name: Customized("custom_specs_model", "feedForwardNN", n_classes=2, n_features=10000, hidden_size=10, layers=2)
  # Path to model checkpoint.
  path: ../alpha_beta_CROWN/complete_verifier/models/elsa_comp/FFNN_normal_small_CEL0109__UnivariateFS-k_best-mutual_info_classif-500_classifier.pth
  input_shape: [-1, 10000]
data:  
  #start: 0
  #end: 1 
  num_outputs: 2  # Number of classes for classification problem.
specification:
  type: lp
attack:
  pgd_order: skip #before
  enable_mip_attack: true
  check_clean: true
  check_binary_features: true
  adv_verifier: Customized("custom_adv_verifier", "binary_features_adv_verifier")
  input_split_check_adv:
    enabled: auto
solver:
  batch_size: 2048
  beta-crown:
    iteration: 50
    # Maybe put this back to true ??? (probably is to slow)
    #all_node_split_LP: true
  mip:
    parallel_solvers: 4
    solver_threads: 2
    # To look into
    adv_warmup: true # I am checking if the adv example is binary so I think I can put this to true
    extra_constraint: true
bab:
  timeout: 900
  branching:
    method: sb
    input_split:
      enable: true
