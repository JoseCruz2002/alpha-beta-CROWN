# Example for using customized model and data loader.
# Model and data loader defined in custom_model_data.py
# python abcrown.py --config exp_configs/tutorial_examples/custom_cifar_data_example.yaml
general:
  device: cpu
  save_output: false
  normal_run: false
  complete_verifier: bab
  enable_incomplete_verification: false
model:
  # Model is defined as simple_conv_model() in custom_model_data.py. The function simple_conv_model() will be called with arguments in_channel=3, out_dim=10.
  name: Customized("custom_specs_model", "feedForwardNN", n_classes=2, n_features=500, hidden_size=10, layers=2)
  # Path to model checkpoint.
  path: complete_verifier/models/elsa_comp/FFNN_normal_small_CEL0109__UnivariateFS-k_best-mutual_info_classif-500_classifier.pth
data:  
  #start: 0
  #end: 1 
  dataset: Customized("custom_model_data", "my_data_loader", fix_features=False)
  num_outputs: 2  # Number of classes for classification problem.
specification:
  type: lp
  norm: null
  epsilon: null
  selected_features_path: ../../../elsa-cybersecurity/track_1/selected_features/UnivariateFS-k_best-mutual_info_classif-500.json
attack:
  pgd_order: skip
solver:
  batch_size: 2048
  beta-crown:
    iteration: 50
    all_node_split_LP: true
bab:
  #initial_max_domains: 2  # CHECK THIS AFTER BUG CORRECTION
  timeout: 2000
  branching:
    method: sb
    input_split:
      enable: true