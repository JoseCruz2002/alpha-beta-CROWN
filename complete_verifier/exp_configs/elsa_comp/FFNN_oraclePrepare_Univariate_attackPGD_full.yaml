# Example for using customized model and data loader.
# Model and data loader defined in custom_model_data.py
# python abcrown.py --config exp_configs/tutorial_examples/custom_cifar_data_example.yaml
general:
  device: cuda:2
  save_output: false
  normal_run: false
  complete_verifier: bab
  enable_incomplete_verification: true
  show_adv_example: true
model:
  # Model is defined as simple_conv_model() in custom_model_data.py. The function simple_conv_model() will be called with arguments in_channel=3, out_dim=10.
  name: Customized("custom_specs_model", "feedForwardNN", n_classes=2, n_features=1461078, hidden_size=10, layers=2)
  # Path to model checkpoint.
  path: ../alpha_beta_CROWN/complete_verifier/models/elsa_comp/FFNN_normal_small_CEL0109__classifier.pth
  input_shape: [-1, 1461078]
data:  
  #start: 0
  #end: 1 
  num_outputs: 2  # Number of classes for classification problem.
specification:
  type: lp
attack:
  pgd_order: before
  check_binary_features: true
solver:
  batch_size: 2048
  beta-crown:
    iteration: 50
    #all_node_split_LP: true
  mip:
    parallel_solvers: 4
    solver_threads: 2
bab:
  #initial_max_domains: 2  # CHECK THIS AFTER BUG CORRECTION
  timeout: 600
  branching:
    method: sb
    input_split:
      enable: true
